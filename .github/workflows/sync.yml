name: Git Mirror Sync (Safe)

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Enviar mirror SEM workflows
        run: |
          git remote add mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Kaka2002/alteracao.git

          # CRÍTICO: remove workflows antes do push
          rm -rf .github/workflows

          git add .
          git commit -m "mirror update" || echo "sem mudanças"

          git push mirror main --force