name: Sync to Alteracao Repo

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push para Repositório de Alteração
        run: |
          export GIT_TERMINAL_PROMPT=0
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Usa a variável global que vamos cadastrar corretamente agora
          git clone "https://x-access-token:${{ secrets.SYNC_TOKEN }}@://github.com" target_repo
          
          find target_repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'target_repo' -exec cp -r {} target_repo/ \;
          
          cd target_repo
          git add -A
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sync: Automação espelhada do repositório principal"
            git push "https://x-access-token:${{ secrets.SYNC_TOKEN }}@://github.com" main
          else
            echo "Nenhuma alteração detectada para sincronizar."
          fi
