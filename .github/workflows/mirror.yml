name: Mirror Safe

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror seguro
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git remote add mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Kaka2002/alteracao.git

          git push mirror main --force