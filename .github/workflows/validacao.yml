name: Validacao do Julian Play

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes e pacote local
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador dos testes
        run: npx playwright install chromium

      - name: Executar testes internos
        run: npm test

      - name: Executar testes de navegacao
        run: npm run test:e2e

      - name: Gerar e validar pacote local limpo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\entrega-cliente-local\USO_INTERNO_NAO_ENVIAR\CRIAR-PACOTE-APP.ps1
          npm run test:pacote-limpo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
