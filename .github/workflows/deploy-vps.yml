name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Deploy to Windows VPS
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa de deploy ${attempt}/3..."
            if ssh -i ~/.ssh/vps_key \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              'powershell -NoProfile -ExecutionPolicy Bypass -File C:\bots\julian-play\deploy.ps1'; then
              exit 0
            fi

            echo "Falha na tentativa ${attempt}. Aguardando para tentar novamente..."
            sleep 15
          done

          echo "Deploy falhou apos 3 tentativas. Verifique se o SSH do servidor esta ativo e se a porta 22 aceita conexoes do GitHub Actions."
          exit 1
