name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Deploy to Windows VPS
        run: |
          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'powershell -ExecutionPolicy Bypass -File C:\bots\julian-play\deploy.ps1'
